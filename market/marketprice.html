<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首都圏鉄道路線図ヒートマップマネージャー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Statistics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
        }
        .map-container {
            cursor: grab;
        }
        .map-container:active {
            cursor: grabbing;
        }
        /* 価格に応じたヒートマップカラー定義 */
        .badge-300 { background-color: #38bdf8; color: #0369a1; } /* 水色 */
        .badge-400 { background-color: #4ade80; color: #166534; } /* 緑 */
        .badge-500 { background-color: #accf34; color: #3f6212; } /* 黄緑 */
        .badge-600 { background-color: #facc15; color: #854d0e; } /* 黄 */
        .badge-700 { background-color: #fb923c; color: #9a3412; } /* オレンジ */
        .badge-8900 { background-color: #f87171; color: #991b1b; } /* 赤 */
        .badge-1000 { background-color: #c084fc; color: #6b21a8; } /* 紫 */
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-md flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-inner flex items-center justify-center">
                <i class="fa-solid fa-train-subway text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white flex items-center space-x-2">
                    <span>首都圏鉄道路線図ヒートマップマネージャー</span>
                    <span class="text-xs px-2 py-0.5 bg-indigo-900/60 text-indigo-300 border border-indigo-700/50 rounded-full">社内資料 2026/6</span>
                </h1>
                <p class="text-xs text-slate-400">路線図ビジュアル分析 ＆ データ管理システム</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 flex-wrap gap-2">
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 shadow">
                <i class="fa-solid fa-plus"></i>
                <span>駅データを追加</span>
            </button>
            <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
                <i class="fa-solid fa-download"></i>
                <span>JSON出力</span>
            </button>
            <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-upload"></i>
                <span>読込</span>
                <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
            </label>
            <button onclick="resetData()" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/50 px-3 py-1.5 rounded-lg text-xs font-medium transition" title="初期データにリセット">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 space-y-4 flex flex-col">

        <!-- トースト通知 -->
        <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700 flex items-center space-x-3">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage" class="text-xs font-medium">通知メッセージ</span>
        </div>

        <!-- ツールバー：タブ、フィルター、表示モード切替 -->
        <div class="bg-slate-950/80 backdrop-blur border border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
            <div class="flex flex-wrap justify-between items-center gap-3">
                <!-- 資料カテゴリタブ -->
                <div class="flex border-b border-slate-800 space-x-1 overflow-x-auto">
                    <button onclick="switchTab('all')" id="tab-all" class="tab-btn px-4 py-2 text-xs font-semibold border-b-2 border-indigo-500 text-indigo-400 whitespace-nowrap transition">
                        首都圏全域ヒートマップ
                    </button>
                    <button onclick="switchTab('3ldk')" id="tab-3ldk" class="tab-btn px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
                        3LDK（70㎡）／1億以内
                    </button>
                    <button onclick="switchTab('ensen')" id="tab-ensen" class="tab-btn px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
                        沿線別ヒートマップ
                    </button>
                    <button onclick="switchTab('table')" id="tab-table" class="tab-btn px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
                        <i class="fa-solid fa-table mr-1"></i> データテーブル一覧
                    </button>
                    <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn px-4 py-2 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
                        <i class="fa-solid fa-chart-pie mr-1"></i> 統計グラフ分析
                    </button>
                </div>

                <!-- ビュー・検索コントロール -->
                <div class="flex items-center space-x-2 flex-wrap gap-2">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="searchKeyword" oninput="renderApp()" placeholder="駅名検索..." class="pl-8 pr-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100">
                    </div>
                    <select id="filterLine" onchange="renderApp()" class="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-200">
                        <option value="">すべての路線</option>
                        <option value="中央線">中央線</option>
                        <option value="京王線">京王線</option>
                        <option value="西武新宿線">西武新宿線</option>
                        <option value="西武池袋線">西武池袋線</option>
                        <option value="山手線">山手線</option>
                        <option value="その他">その他</option>
                    </select>
                    <select id="filterPriceRange" onchange="renderApp()" class="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-200">
                        <option value="">すべての価格帯</option>
                        <option value="300万台">300万台</option>
                        <option value="400万台">400万台</option>
                        <option value="500万台">500万台</option>
                        <option value="600万台">600万台</option>
                        <option value="700万台">700万台</option>
                        <option value="800～900万台">800～900万台</option>
                        <option value="1000万以上">1000万以上</option>
                    </select>
                </div>
            </div>

            <!-- ヒートマップのカラー凡例 -->
            <div class="flex items-center space-x-3 overflow-x-auto pt-2 border-t border-slate-800/60 text-xs text-slate-400">
                <span class="font-semibold text-slate-300">ヒートマップ凡例:</span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#38bdf8]"></span><span>300万台</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#4ade80]"></span><span>400万台</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#accf34]"></span><span>500万台</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#facc15]"></span><span>600万台</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#fb923c]"></span><span>700万台</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#f87171]"></span><span>800-900万台</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded-full bg-[#c084fc]"></span><span>1000万以上</span></span>
            </div>
        </div>

        <!-- メイン画面エリア（路線図ビュー / テーブルビュー / グラフビュー） -->
        <div class="flex-grow flex flex-col space-y-4">

            <!-- 1. 路線図ビジュアルキャンバスビュー -->
            <div id="mapViewContainer" class="relative bg-slate-950 border border-slate-800 rounded-2xl shadow-inner overflow-hidden flex-grow min-h-[550px] flex items-center justify-center map-container">
                <!-- ズーム操作パネル -->
                <div class="absolute top-4 right-4 z-20 flex flex-col space-y-1 bg-slate-900/90 border border-slate-700 p-1.5 rounded-xl shadow-lg backdrop-blur">
                    <button onclick="zoomMap(1.2)" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 text-xs" title="拡大"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button onclick="resetZoom()" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 text-xs" title="リセット"><i class="fa-solid fa-house"></i></button>
                    <button onclick="zoomMap(0.8)" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 text-xs" title="縮小"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                </div>

                <!-- 路線図SVG（ドラッグ・パン対応コンテナ） -->
                <div id="svgWrapper" class="w-full h-full flex items-center justify-center transition-transform duration-100 origin-center select-none" style="transform: scale(1);">
                    <svg id="railwayMap" class="w-full h-full" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
                        <!-- 背景グリッド線 -->
                        <defs>
                            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
                            </pattern>
                        </defs>
                        <rect width="1000" height="700" fill="url(#grid)" />

                        <!-- 鉄道路線（パス） -->
                        <!-- 中央線 (オレンジ系) -->
                        <path d="M 120 350 L 250 350 L 400 300 L 550 280 L 700 280" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                        <!-- 京王線 (赤紫系) -->
                        <path d="M 120 420 L 260 410 L 410 370 L 580 340" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                        <!-- 西武新宿線 (青系) -->
                        <path d="M 200 230 L 320 250 L 440 280 L 560 270" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                        <!-- 西武池袋線 (黄緑系) -->
                        <path d="M 180 180 L 300 200 L 450 220 L 620 230" fill="none" stroke="#65a30d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                        <!-- 山手線 (環状線・緑) -->
                        <circle cx="520" cy="320" r="90" fill="none" stroke="#16a34a" stroke-width="4" opacity="0.8"/>
                        <!-- 都営・地下鉄その他 -->
                        <path d="M 480 150 L 520 320 L 550 480" fill="none" stroke="#9333ea" stroke-width="3" stroke-dasharray="4" opacity="0.7"/>

                        <!-- 駅マーカーノードはJSで動的配置 -->
                        <g id="stationNodes"></g>
                    </svg>
                </div>
                
                <!-- キャンバス下部インフォ -->
                <div class="absolute bottom-4 left-4 z-20 bg-slate-900/90 border border-slate-700 px-3 py-2 rounded-xl text-xs text-slate-300 backdrop-blur flex items-center space-x-2">
                    <i class="fa-solid fa-circle-info text-indigo-400"></i>
                    <span>駅ノードをクリックすると詳細・編集モーダルが開きます（ドラッグで移動可能）</span>
                </div>
            </div>

            <!-- 2. データテーブル一覧ビュー -->
            <div id="tableViewContainer" class="hidden bg-slate-950 border border-slate-800 rounded-2xl shadow-sm overflow-hidden flex-grow">
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-slate-900 z-10 text-xs font-semibold text-slate-400 border-b border-slate-800 uppercase">
                            <tr>
                                <th class="py-3 px-4">駅名</th>
                                <th class="py-3 px-4">坪単価</th>
                                <th class="py-3 px-4">70㎡価格</th>
                                <th class="py-3 px-4">価格帯</th>
                                <th class="py-3 px-4">路線</th>
                                <th class="py-3 px-4">カテゴリ</th>
                                <th class="py-3 px-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-800 text-xs text-slate-200">
                            <!-- 動的生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 3. 統計・グラフ分析ビュー -->
            <div id="analyticsViewContainer" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
                <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 flex flex-col">
                    <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center space-x-2">
                        <i class="fa-solid fa-chart-pie text-indigo-400"></i>
                        <span>価格帯別 駅数分布割合</span>
                    </h3>
                    <div class="relative flex-grow flex items-center justify-center min-h-[250px]">
                        <canvas id="priceRangeChart"></canvas>
                    </div>
                </div>
                <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 flex flex-col">
                    <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center space-x-2">
                        <i class="fa-solid fa-chart-column text-indigo-400"></i>
                        <span>路線別 平均坪単価比較</span>
                    </h3>
                    <div class="relative flex-grow flex items-center justify-center min-h-[250px]">
                        <canvas id="lineAvgChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- モーダル（追加・編集・詳細） -->
    <div id="stationModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="bg-slate-950 px-5 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-sm text-white">駅データ管理</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="stationForm" onsubmit="saveStation(event)" class="p-5 space-y-3.5 text-xs">
                <input type="hidden" id="editIndex" value="-1">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">駅名 <span class="text-rose-400">*</span></label>
                    <input type="text" id="stationName" required placeholder="例: 新宿" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">坪単価 (万円) <span class="text-rose-400">*</span></label>
                        <input type="number" id="stationTsubo" required min="100" max="3000" placeholder="750" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">70㎡価格 (万円) <span class="text-rose-400">*</span></label>
                        <input type="number" id="stationPrice" required min="500" max="15000" placeholder="15800" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">価格帯</label>
                        <select id="stationRange" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                            <option value="300万台">300万台</option>
                            <option value="400万台">400万台</option>
                            <option value="500万台">500万台</option>
                            <option value="600万台">600万台</option>
                            <option value="700万台">700万台</option>
                            <option value="800～900万台">800～900万台</option>
                            <option value="1000万以上" selected>1000万以上</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">路線</label>
                        <select id="stationLine" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                            <option value="中央線">中央線</option>
                            <option value="京王線">京王線</option>
                            <option value="西武新宿線">西武新宿線</option>
                            <option value="西武池袋線">西武池袋線</option>
                            <option value="山手線">山手線</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-1">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">路線図X座標</label>
                        <input type="number" id="stationX" value="500" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">路線図Y座標</label>
                        <input type="number" id="stationY" value="350" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">カテゴリ</label>
                        <select id="stationCategory" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white">
                            <option value="all">全域</option>
                            <option value="3ldk">3LDK内</option>
                            <option value="ensen">沿線別</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 flex justify-end space-x-2 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-medium transition">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium shadow transition">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- フッター -->
    <footer class="bg-slate-950 border-t border-slate-800 py-3 text-center text-xs text-slate-500">
        &copy; 2026 首都圏鉄道路線図ヒートマップマネージャー. 社内資料 2026/6 版
    </footer>

    <!-- スクリプト部 -->
    <script>
        // 路線図上の位置座標つき駅データセット
        const defaultStations = [
            { name: "八王子", tsubo: 400, price: 8400, range: "400万台", line: "中央線", category: "all", x: 120, y: 350 },
            { name: "立川", tsubo: 480, price: 10100, range: "400万台", line: "中央線", category: "all", x: 250, y: 350 },
            { name: "吉祥寺", tsubo: 750, price: 15800, range: "700万台", line: "中央線", category: "all", x: 400, y: 300 },
            { name: "中野", tsubo: 850, price: 18000, range: "800～900万台", line: "中央線", category: "all", x: 480, y: 280 },
            { name: "新宿", tsubo: 1200, price: 25000, range: "1000万以上", line: "山手線", category: "all", x: 520, y: 320 },
            { name: "東京", tsubo: 1400, price: 29600, range: "1000万以上", line: "中央線", category: "all", x: 700, y: 280 },
            
            { name: "府中", tsubo: 440, price: 9300, range: "400万台", line: "京王線", category: "ensen", x: 260, y: 410 },
            { name: "明大前", tsubo: 650, price: 13700, range: "600万台", line: "京王線", category: "ensen", x: 410, y: 370 },
            { name: "渋谷", tsubo: 1300, price: 28000, range: "1000万以上", line: "山手線", category: "all", x: 520, y: 400 },

            { name: "所沢", tsubo: 350, price: 7400, range: "300万台", line: "西武新宿線", category: "all", x: 200, y: 230 },
            { name: "田無", tsubo: 350, price: 7400, range: "300万台", line: "西武新宿線", category: "all", x: 320, y: 250 },
            { name: "高田馬場", tsubo: 900, price: 19000, range: "800～900万台", line: "山手線", category: "all", x: 520, y: 240 },

            { name: "石神井公園", tsubo: 600, price: 12700, range: "600万台", line: "西武池袋線", category: "all", x: 300, y: 200 },
            { name: "練馬", tsubo: 600, price: 12700, range: "600万台", line: "西武池袋線", category: "all", x: 450, y: 220 },
            { name: "池袋", tsubo: 1100, price: 23500, range: "1000万以上", line: "山手線", category: "all", x: 460, y: 260 },

            { name: "光が丘", tsubo: 450, price: 9500, range: "400万台", line: "その他", category: "3ldk", x: 350, y: 150 },
            { name: "上石神井", tsubo: 450, price: 9500, range: "400万台", line: "西武新宿線", category: "3ldk", x: 360, y: 230 },
            { name: "荻窪", tsubo: 700, price: 14800, range: "700万台", line: "中央線", category: "all", x: 440, y: 290 },
            { name: "品川", tsubo: 800, price: 16900, range: "800～900万台", line: "山手線", category: "all", x: 580, y: 400 },
            { name: "上野", tsubo: 750, price: 15800, range: "700万台", line: "山手線", category: "all", x: 580, y: 240 },
            { name: "恵比寿", tsubo: 1400, price: 29600, range: "1000万以上", line: "山手線", category: "all", x: 500, y: 380 }
        ];

        let stations = [];
        let currentTab = 'all'; // 'all', '3ldk', 'ensen', 'table', 'analytics'
        let currentScale = 1;
        let priceChartInstance = null;
        let lineChartInstance = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderApp();
        });

        function loadData() {
            const saved = localStorage.getItem('capital_railway_heatmap_2026');
            if (saved) {
                try {
                    stations = JSON.parse(saved);
                } catch (e) {
                    stations = [...defaultStations];
                }
            } else {
                stations = [...defaultStations];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('capital_railway_heatmap_2026', JSON.stringify(stations));
        }

        function resetData() {
            if (confirm('データを初期状態にリセットしますか？')) {
                stations = [...defaultStations];
                saveToLocalStorage();
                renderApp();
                showToast('データを初期状態にリセットしました');
            }
        }

        // タブ切り替え
        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-indigo-500', 'text-indigo-400');
                btn.classList.add('border-transparent', 'text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-slate-400');
                activeBtn.classList.add('border-indigo-500', 'text-indigo-400');
            }

            const mapView = document.getElementById('mapViewContainer');
            const tableView = document.getElementById('tableViewContainer');
            const analyticsView = document.getElementById('analyticsViewContainer');

            mapView.classList.add('hidden');
            tableView.classList.add('hidden');
            analyticsView.classList.add('hidden');

            if (tabId === 'table') {
                tableView.classList.remove('hidden');
                renderTable();
            } else if (tabId === 'analytics') {
                analyticsView.classList.remove('hidden');
                renderCharts();
            } else {
                mapView.classList.remove('hidden');
                renderMapNodes();
            }
        }

        function renderApp() {
            if (currentTab === 'table') {
                renderTable();
            } else if (currentTab === 'analytics') {
                renderCharts();
            } else {
                renderMapNodes();
            }
        }

        // 価格に応じたカラークラス取得
        function getBadgeClass(range) {
            switch (range) {
                case '300万台': return 'badge-300';
                case '400万台': return 'badge-400';
                case '500万台': return 'badge-500';
                case '600万台': return 'badge-600';
                case '700万台': return 'badge-700';
                case '800～900万台': return 'badge-8900';
                case '1000万以上': return 'badge-1000';
                default: return 'badge-400';
            }
        }

        function getHexColor(range) {
            switch (range) {
                case '300万台': return '#38bdf8';
                case '400万台': return '#4ade80';
                case '500万台': return '#accf34';
                case '600万台': return '#facc15';
                case '700万台': return '#fb923c';
                case '800～900万台': return '#f87171';
                case '1000万以上': return '#c084fc';
                default: return '#4ade80';
            }
        }

        // 路線図SVG上に駅ノードを描画
        function renderMapNodes() {
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();
            const filterLine = document.getElementById('filterLine').value;
            const filterRange = document.getElementById('filterPriceRange').value;

            const filtered = stations.filter(st => {
                const matchTab = currentTab === 'all' || st.category === currentTab;
                const matchKeyword = st.name.toLowerCase().includes(keyword);
                const matchLine = !filterLine || st.line === filterLine;
                const matchRange = !filterRange || st.range === filterRange;
                return matchTab && matchKeyword && matchLine && matchRange;
            });

            const container = document.getElementById('stationNodes');
            container.innerHTML = '';

            filtered.forEach(st => {
                const originalIndex = stations.findIndex(item => item === st);
                const color = getHexColor(st.range);

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('transform', `translate(${st.x}, ${st.y})`);
                g.setAttribute('class', 'cursor-pointer group');
                g.setAttribute('onclick', `openEditModal(${originalIndex})`);

                // 外側グロー / ヒートマップ円
                const circleBg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circleBg.setAttribute('r', '14');
                circleBg.setAttribute('fill', color);
                circleBg.setAttribute('opacity', '0.3');
                g.appendChild(circleBg);

                // 駅中心ノード
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '6');
                circle.setAttribute('fill', color);
                circle.setAttribute('stroke', '#0f172a');
                circle.setAttribute('stroke-width', '2');
                g.appendChild(circle);

                // 駅名・単価テキストラベル
                const textBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                textBg.setAttribute('x', '10');
                textBg.setAttribute('y', '-10');
                textBg.setAttribute('width', `${Math.max(st.name.length * 12 + 35, 65)}`);
                textBg.setAttribute('height', '26');
                textBg.setAttribute('rx', '4');
                textBg.setAttribute('fill', '#090d16');
                textBg.setAttribute('stroke', '#334155');
                textBg.setAttribute('stroke-width', '1');
                g.appendChild(textBg);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', '16');
                text.setAttribute('y', '7');
                text.setAttribute('fill', '#f8fafc');
                text.setAttribute('font-size', '10px');
                text.setAttribute('font-family', 'sans-serif');
                text.textContent = `${st.name} (${st.tsubo}万)`;
                g.appendChild(text);

                container.appendChild(g);
            });
        }

        // テーブル一覧描画
        function renderTable() {
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();
            const filterLine = document.getElementById('filterLine').value;
            const filterRange = document.getElementById('filterPriceRange').value;

            const filtered = stations.filter(st => {
                const matchKeyword = st.name.toLowerCase().includes(keyword);
                const matchLine = !filterLine || st.line === filterLine;
                const matchRange = !filterRange || st.range === filterRange;
                return matchKeyword && matchLine && matchRange;
            });

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">該当する駅データが見つかりません。</td></tr>`;
                return;
            }

            filtered.forEach(st => {
                const originalIndex = stations.findIndex(item => item === st);
                const badgeClass = getBadgeClass(st.range);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-900 transition border-b border-slate-800/60";
                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-semibold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-train text-indigo-400 text-xs"></i>
                        <span>${escapeHTML(st.name)}</span>
                    </td>
                    <td class="py-2.5 px-4 font-mono font-medium">${st.tsubo} 万円</td>
                    <td class="py-2.5 px-4 font-mono font-medium">${st.price} 万円</td>
                    <td class="py-2.5 px-4">
                        <span class="px-2 py-0.5 text-xs font-semibold rounded border ${badgeClass}">${st.range}</span>
                    </td>
                    <td class="py-2.5 px-4 text-slate-300">${escapeHTML(st.line)}</td>
                    <td class="py-2.5 px-4 text-slate-400">${st.category}</td>
                    <td class="py-2.5 px-4 text-right space-x-2">
                        <button onclick="openEditModal(${originalIndex})" class="text-slate-400 hover:text-indigo-400 transition p-1" title="編集"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteStation(${originalIndex})" class="text-slate-400 hover:text-rose-400 transition p-1" title="削除"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 統計グラフ描画
        function renderCharts() {
            const ranges = ["300万台", "400万台", "500万台", "600万台", "700万台", "800～900万台", "1000万以上"];
            const rangeCounts = ranges.map(r => stations.filter(s => s.range === r).length);

            if (priceChartInstance) priceChartInstance.destroy();
            const ctxPrice = document.getElementById('priceRangeChart').getContext('2d');
            priceChartInstance = new Chart(ctxPrice, {
                type: 'doughnut',
                data: {
                    labels: ranges,
                    datasets: [{
                        data: rangeCounts,
                        backgroundColor: ['#38bdf8', '#4ade80', '#accf34', '#facc15', '#fb923c', '#f87171', '#c084fc'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });

            const lines = ["中央線", "京王線", "西武新宿線", "西武池袋線", "山手線", "その他"];
            const lineAvg = lines.map(l => {
                const filtered = stations.filter(s => s.line === l);
                if (filtered.length === 0) return 0;
                return Math.round(filtered.reduce((acc, cur) => acc + Number(cur.tsubo), 0) / filtered.length);
            });

            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('lineAvgChart').getContext('2d');
            lineChartInstance = new Chart(ctxLine, {
                type: 'bar',
                data: {
                    labels: lines,
                    datasets: [{
                        label: '平均坪単価 (万円)',
                        data: lineAvg,
                        backgroundColor: '#6366f1',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
                        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' }, beginAtZero: true }
                    }
                }
            });
        }

        // 路線図ズーム操作
        function zoomMap(factor) {
            currentScale = Math.max(0.6, Math.min(2.5, currentScale * factor));
            document.getElementById('svgWrapper').style.transform = `scale(${currentScale})`;
        }
        function resetZoom() {
            currentScale = 1;
            document.getElementById('svgWrapper').style.transform = `scale(1)`;
        }

        // モーダル操作
        function openAddModal() {
            document.getElementById('modalTitle').textContent = "新規駅データ追加";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('stationName').value = "";
            document.getElementById('stationTsubo').value = "";
            document.getElementById('stationPrice').value = "";
            document.getElementById('stationX').value = Math.floor(Math.random() * 400) + 200;
            document.getElementById('stationY').value = Math.floor(Math.random() * 300) + 150;
            document.getElementById('stationModal').classList.remove('hidden');
        }

        function openEditModal(index) {
            const st = stations[index];
            document.getElementById('modalTitle').textContent = "駅データ編集";
            document.getElementById('editIndex').value = index;
            document.getElementById('stationName').value = st.name;
            document.getElementById('stationTsubo').value = st.tsubo;
            document.getElementById('stationPrice').value = st.price;
            document.getElementById('stationRange').value = st.range;
            document.getElementById('stationLine').value = st.line;
            document.getElementById('stationX').value = st.x || 500;
            document.getElementById('stationY').value = st.y || 350;
            document.getElementById('stationCategory').value = st.category || 'all';
            document.getElementById('stationModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('stationModal').classList.add('hidden');
        }

        function saveStation(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const name = document.getElementById('stationName').value.trim();
            const tsubo = Number(document.getElementById('stationTsubo').value);
            const price = Number(document.getElementById('stationPrice').value);
            const range = document.getElementById('stationRange').value;
            const line = document.getElementById('stationLine').value;
            const x = Number(document.getElementById('stationX').value);
            const y = Number(document.getElementById('stationY').value);
            const category = document.getElementById('stationCategory').value;

            if (!name || isNaN(tsubo) || isNaN(price)) {
                showToast("正しい値を入力してください", "error");
                return;
            }

            const data = { name, tsubo, price, range, line, x, y, category };

            if (index === -1) {
                stations.unshift(data);
                showToast("新しい駅データを追加しました");
            } else {
                stations[index] = data;
                showToast("駅データを更新しました");
            }

            saveToLocalStorage();
            closeModal();
            renderApp();
        }

        function deleteStation(index) {
            if (confirm(`「${stations[index].name}」のデータを削除しますか？`)) {
                stations.splice(index, 1);
                saveToLocalStorage();
                renderApp();
                showToast("データを削除しました");
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stations, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "capital_railway_heatmap_2026.json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
            showToast("JSONファイルをエクスポートしました");
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        stations = parsed;
                        saveToLocalStorage();
                        renderApp();
                        showToast("データを正常にインポートしました");
                    }
                } catch (err) {
                    showToast("ファイルの読み込みに失敗しました", "error");
                }
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').className = type === 'error' ? "fa-solid fa-circle-exclamation text-rose-400" : "fa-solid fa-circle-check text-emerald-400";
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"\\]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;', '\\': '&#92;' }[tag] || tag));
        }
    </script>
</body>
</html>
